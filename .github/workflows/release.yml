name: Release Multiplatform (Linux AppImage, Pacman Repo & Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Linux source (main)
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libasound2-dev libfontconfig1-dev fuse

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Package AppImage
        run: |
          chmod +x ./build-appimage.sh
          ./build-appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlens-linux-appimage
          path: dist/NetLens-x86_64.AppImage

  deploy-pacman-repo:
    name: Build Pacman Package & Sync netlens-repo
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo zstd

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "./packaging/build-pacman-repo.sh"

      - name: Deploy to GitHub Pages (netlens-repo)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.REPO_DEPLOY_TOKEN }}
          external_repository: ${{ github.repository_owner }}/netlens-repo
          publish_branch: main
          publish_dir: ./dist/repo
          keep_files: true

  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout Windows source (windows branch)
        uses: actions/checkout@v4
        with:
          ref: windows

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Package Windows
        shell: pwsh
        run: ./build-windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlens-windows-zip
          path: dist/*.zip

  create-github-release:
    name: Publish GitHub Release
    needs: [build-linux-appimage, deploy-pacman-repo, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source for version metadata
        uses: actions/checkout@v4

      - name: Extract NetLens version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=v${VERSION}" >> $GITHUB_ENV
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: netlens-linux-appimage
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: netlens-windows-zip
          path: release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: NetLens ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/NetLens-x86_64.AppImage
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release & Deploy Pacman Repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo zstd

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Release
        run: cargo build --release

      - name: Package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "./packaging/build-pacman-repo.sh"

      - name: Deploy to GitHub Pages (netlens-repo)
        uses: peaceiris/actions-gh-pages@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          personal_token: ${{ secrets.REPO_DEPLOY_TOKEN }}
          external_repository: ${{ github.repository_owner }}/netlens-repo
          publish_branch: main
          publish_dir: ./dist/repo

[package]
name = "netlens"
version = "0.2.19"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dns-lookup = "4.0.2"
iced = { version = "0.14.0", features = ["tokio", "canvas", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "process", "sync", "io-util", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

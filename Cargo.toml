[package]
name = "netlens"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dns-lookup = "4.0.2"
iced = { version = "0.14.0", features = ["tokio"] }
mac_oui = { version = "0.4.11", features = ["with-db"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
